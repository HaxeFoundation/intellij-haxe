org.gradle.jvmargs=-Xmx2g

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib

# Normally this would be false, but there seems to be some kind of issue with  the current setup
# Debug metadata version mismatch. Expected: 1, got 2. Please update the Kotlin standard library.
#	at kotlin.coroutines.jvm.internal.DebugMetadataKt.checkDebugMetadataVersion(DebugMetadata.kt:103)
kotlin.stdlib.default.dependency = true

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = false

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

# IntelliJ Platform Artifacts Repositories
# -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.intellij.plugins.haxe
pluginName = Haxe Toolkit Support
pluginRepositoryUrl = https://github.com/HaxeFoundation/intellij-haxe

# SemVer format -> https://semver.org
pluginVersion = 1.9.0

# IntelliJ Platform Properties -> https://github.com/JetBrains/gradle-intellij-plugin#intellij-platform-properties
platformType = IU
#platformType = IC


#run print product releases to see what's the LATEST-EAP-SNAPSHOT
#platformVersion = 2026.1.4
platformVersion = 2026.2
platformDownloadSources = true

# See https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# for insight into build numbers and IntelliJ Platform versions.
pluginSinceBuild = 261
pluginUntilBuild = 262.*

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.intellij.java, com.jetbrains.php:203.4449.22
# versions numbers can be found at :
# flex/flash : https://plugins.jetbrains.com/plugin/14508-flash-flex/versions/stable/252411
# classic UI :  https://plugins.jetbrains.com/plugin/24468-classic-ui
# Git Modal Commit Interface  : https://plugins.jetbrains.com/plugin/26647-git-modal-commit-interface
# OpenGL-Plugin :  https://plugins.jetbrains.com/plugin/18470-glsl

# 2026.2
platformBundledPlugins = com.intellij.java, com.intellij.modules.json, tanvd.grazi, org.jetbrains.kotlin 
platformPlugins = com.intellij.flex:262.8665.176, OpenGL-Plugin:1.1.6, com.intellij.classic.ui:262.8665.173, intellij.git.commit.modal:262.8665.97
platformBundledModules = intellij.spellchecker

# 2026.1
#platformBundledPlugins = com.intellij.java, com.intellij.modules.json, tanvd.grazi
#platformPlugins = com.intellij.flex:261.22158.182, OpenGL-Plugin:1.1.6, com.intellij.classic.ui:261.22158.185, intellij.git.commit.modal:261.22158.41
#platformBundledModules = intellij.spellchecker


# Java language level used to compile sources and to generate the files for - Java 17 is required since 2022.2
javaVersion = 25

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.4.1

#Hxcpp Debugger dependencies
hxjavaVersion=4.2.0
hxcppDebuggerGit=https://github.com/HaxeFoundation/hxcpp-debugger.git
hxcppDebuggerBranch=protocol_v1.1
generateHxcppDebugger=false

# change haxelib versions to the ones used in this build
# --always / --never
haxeLibChangeVersion=--always

# HashLink debug adapter
# Set to false to skip compiling the DAP adapter to HashLink bytecode.
# The build is also skipped automatically (with a warning) when the haxe compiler is not on PATH.
buildHashlinkAdapter=true