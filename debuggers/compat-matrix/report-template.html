<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debugger compatibility matrix</title>
<style>
  :root {
    --bg: #fcfcfb; --card: #f1efe8; --text: #0b0b0b; --text-2: #52514e; --text-3: #898781;
    --border: rgba(11,11,11,0.12); --ok-bg: #e1f5ee; --ok-text: #085041; --ok-border: #9fe1cb;
    --bad-bg: #fcebeb; --bad-text: #791f1f; --bad-border: #f7c1c1;
    --warn-bg: #faeeda; --warn-text: #633806; --warn-border: #fac775;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a19; --card: #2c2c2a; --text: #ffffff; --text-2: #c3c2b7; --text-3: #898781;
      --border: rgba(255,255,255,0.12); --ok-bg: #085041; --ok-text: #9fe1cb; --ok-border: #0f6e56;
      --bad-bg: #501313; --bad-text: #f7c1c1; --bad-border: #791f1f;
      --warn-bg: #412402; --warn-text: #fac775; --warn-border: #633806;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem clamp(1rem, 5vw, 3rem); background: var(--bg); color: var(--text);
         font: 400 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  h2 { font-size: 18px; font-weight: 500; margin: 2.5rem 0 0.75rem; }
  .meta { color: var(--text-3); font-size: 13px; margin: 0 0 1.5rem; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 1.5rem 0; }
  .card { background: var(--card); border-radius: 8px; padding: 1rem; }
  .card .label { font-size: 13px; color: var(--text-3); margin: 0 0 4px; }
  .card .value { font-size: 24px; font-weight: 500; margin: 0; }
  .card .value.ok { color: var(--ok-text); }
  .card .value.bad { color: var(--bad-text); }
  .gridwrap { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 13px; min-width: 100%; }
  th { text-align: center; padding: 8px 10px; font-weight: 500; color: var(--text-2);
       border-bottom: 1px solid var(--border); white-space: nowrap; }
  th.rowhead, td.rowhead { text-align: left; }
  td { padding: 5px 8px; text-align: center; border-bottom: 1px solid var(--border); }
  td.rowhead { color: var(--text); white-space: nowrap; padding-right: 16px; }
  .pill { display: inline-block; min-width: 48px; padding: 3px 9px; border-radius: 7px; font-weight: 500; }
  .pill.ok   { background: var(--ok-bg);   color: var(--ok-text);   border: 1px solid var(--ok-border); }
  .pill.bad  { background: var(--bad-bg);  color: var(--bad-text);  border: 1px solid var(--bad-border); }
  .pill.warn { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-border); }
  .pill.na   { color: var(--text-3); }
  details { margin: 0.75rem 0; font-size: 13px; }
  summary { cursor: pointer; color: var(--bad-text); font-weight: 500; }
  .fail-item { margin: 6px 0 6px 1rem; color: var(--text-2); }
  .fail-item code { color: var(--text); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text-2); }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<h1>Debugger compatibility matrix</h1>
<p class="meta" id="meta"></p>
<div class="cards" id="cards"></div>
<div id="lanes"></div>
<div class="legend">
  <span><span class="sw" style="background:var(--ok-bg);border:1px solid var(--ok-border)"></span>all tests passed</span>
  <span><span class="sw" style="background:var(--bad-bg);border:1px solid var(--bad-border)"></span>failures (count shown)</span>
  <span><span class="sw" style="background:var(--warn-bg);border:1px solid var(--warn-border)"></span>lane problem (compile-fail / timeout / all skipped)</span>
  <span>n/m &mdash; the shortfall is skips, not failures (lists under each grid)</span>
  <span>&mdash; not run (smart-reduced grid)</span>
</div>
<script>
const DATA = /*__DATA__*/null;
if (!DATA) {
  document.getElementById("meta").textContent =
    "This is the raw template - run run-matrix.ps1 (or `gradlew debuggerCompatibilityReport`) to generate a filled report.";
  throw new Error("template without data");
}
const LANE_TITLES = { eval: "Eval / interpreter debugger", hashlink: "HashLink debugger", hxcpp: "HXCPP debugger",
                      firefox: "Web / Firefox debugger (vscode-firefox-debug)",
                      chromium: "Web / Chromium debugger (vscode-js-debug)" };

function shortHaxe(v) { return v.replace(/^haxe_/, "").replace(/_/g, "."); }
function shortHl(v) { return v.replace(/^hashlink-/, "").replace(/-win(32|64)?$/, m => m.replace("-win", " ")); }
function cellTotals(cell) {
  let t = 0, f = 0, s = 0;
  for (const c of cell.classes) { t += c.tests; f += c.failures + c.errors; s += c.skipped; }
  return { tests: t, fails: f, skips: s };
}
// passed/total; a shortfall in the fraction is skips, never failures
// (failures render as their own red pill)
function okPill(passed, total, skips, flaky) {
  if (passed === 0 && total > 0) {
    return '<span class="pill warn" title="every test skipped (missing runtime?)">skipped</span>';
  }
  const title = (skips > 0 ? skips + ' skipped (see list below the grid)' : '')
    + (skips > 0 && flaky > 0 ? '; ' : '')
    + (flaky > 0 ? flaky + ' flaky test(s) passed on retry' : '');
  return '<span class="pill ok"' + (title ? ' title="' + title + '"' : '') + '>'
    + passed + '/' + total + (flaky > 0 ? ' ~' : '') + '</span>';
}
function pill(cell) {
  if (!cell) return '<span class="pill na">&mdash;</span>';
  if (cell.status === "compile-fail") return '<span class="pill warn">no build</span>';
  if (cell.status === "timeout") return '<span class="pill warn">timeout</span>';
  const { tests, fails, skips } = cellTotals(cell);
  if (tests === 0) return '<span class="pill warn">no tests</span>';
  if (fails > 0) return '<span class="pill bad">' + fails + ' fail</span>';
  return okPill(tests - skips, tests, skips, (cell.flaky || []).length);
}
// The skip lists under a lane's grid, in two honestly-separated classes:
// "known limitations" are tests that FLAGGED themselves as deliberately not
// applicable to an OS / haxe version (Assume message marked
// "known limitation:", e.g. the HashLink pre-4.3 exception tests or the
// multi-thread tests on linux); everything else merely lacked a prerequisite
// in THIS pass (runtime not provisioned, fixture not built) and is labeled
// as exactly that, never as something that cannot run.
// Grouped by test + reason; the cells are spelled out unless it is all of them.
function skipGroups(cells, wantKnown) {
  const groups = new Map();
  for (const cell of cells) {
    const where = shortHaxe(cell.haxe) + (cell.runtime ? " × " + shortHl(cell.runtime) : "");
    for (const c of cell.classes) {
      for (const s of (c.skippedTests || [])) {
        if (!!s.known !== wantKnown) continue;
        const key = c.name + "::" + s.test + " " + (s.message || "");
        if (!groups.has(key)) groups.set(key, { what: c.name + "::" + s.test, message: s.message || "", wheres: [] });
        groups.get(key).wheres.push(where);
      }
    }
  }
  return [...groups.values()];
}
function skipDetails(cells, groups, summary) {
  if (groups.length === 0) return "";
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  let total = 0;
  for (const g of groups) total += g.wheres.length;
  return "<details><summary style='color: var(--text-2);'>" + total + " skipped test run"
    + (total > 1 ? "s" : "") + " — " + summary + "</summary>"
    + groups.map(g => "<div class='fail-item'><code>" + esc(g.what) + "</code>"
        + (g.message ? " — " + esc(g.message) : "")
        + "<br>" + (g.wheres.length === cells.length ? "every cell" : "on " + g.wheres.join(", ")) + "</div>").join("")
    + "</details>";
}
function skipSection(cells) {
  return skipDetails(cells, skipGroups(cells, true),
      "known limitations (flagged not to run on this OS / toolchain version)")
    + skipDetails(cells, skipGroups(cells, false),
      "prerequisite missing in this pass (runtime not provisioned or fixture not built)");
}

function failuresOf(cells) {
  const out = [];
  for (const cell of cells) {
    for (const c of cell.classes) {
      for (const f of (c.failed || [])) {
        out.push({ where: shortHaxe(cell.haxe) + (cell.runtime ? " × " + shortHl(cell.runtime) : ""),
                   what: c.name + "::" + f.test, message: f.message || "" });
      }
    }
  }
  return out;
}

const byLane = {};
for (const cell of DATA.cells) (byLane[cell.lane] = byLane[cell.lane] || []).push(cell);

const meta = document.getElementById("meta");
meta.textContent = "generated " + DATA.meta.generated + " · store: " + DATA.meta.testData
  + " · " + DATA.meta.haxeVersions.length + " haxe versions"
  + (byLane.hashlink ? " · " + DATA.meta.hlRuntimes.length + " HL runtimes" + (DATA.meta.full ? " (full grid)" : " (smart-reduced)") : "");

const cards = document.getElementById("cards");
for (const lane of Object.keys(LANE_TITLES)) {
  const cells = byLane[lane];
  if (!cells) continue;
  let tests = 0, fails = 0, skips = 0, problems = 0, seconds = 0;
  for (const cell of cells) {
    if (cell.status !== "ok" && cell.status !== "fail") problems++;
    const t = cellTotals(cell); tests += t.tests; fails += t.fails; skips += t.skips;
    seconds += cell.seconds || 0;
  }
  const passed = tests - skips;
  const good = fails === 0 && problems === 0;
  const allSkipped = good && passed === 0 && tests > 0;
  cards.insertAdjacentHTML("beforeend",
    '<div class="card"><p class="label">' + LANE_TITLES[lane] + '</p><p class="value ' + (good ? (allSkipped ? "" : "ok") : "bad") + '">'
    + (good ? (allSkipped ? "all skipped" : passed + "/" + passed) : fails + " failing") + '</p>'
    + '<p class="label" style="margin-top:4px">runtime ' + fmtDuration(seconds)
    + (skips > 0 ? ' · ' + skips + ' skipped' : '') + '</p></div>');
}

// "runtime" = summed cell durations (compute time; with -PmatrixParallel the
// lanes overlap, so lane runtimes can add up to more than the wall clock)
function fmtDuration(seconds) {
  const m = Math.floor(seconds / 60), s = Math.round(seconds % 60);
  return m > 0 ? m + "m " + (s < 10 ? "0" : "") + s + "s" : s + "s";
}

const lanes = document.getElementById("lanes");
for (const lane of Object.keys(LANE_TITLES)) {
  const cells = byLane[lane];
  if (!cells) continue;
  let html = "<h2>" + LANE_TITLES[lane] + "</h2><div class='gridwrap'><table>";
  // a lane whose cells carry a runtime dimension (hashlink: HL runtimes;
  // web lanes: node runtimes) renders the haxe x runtime grid
  const laneRuntimes = lane === "hashlink" ? DATA.meta.hlRuntimes
    : [...new Set(cells.map(c => c.runtime).filter(r => r))].sort();
  if (laneRuntimes.length > 0) {
    const runtimes = laneRuntimes;
    const shortRuntime = r => r.startsWith("hashlink-") ? shortHl(r) : r.replace(/^node-/, "node ");
    html += "<tr><th class='rowhead'>haxe \\ runtime</th>" + runtimes.map(r => "<th>" + shortRuntime(r) + "</th>").join("") + "</tr>";
    for (const haxe of DATA.meta.haxeVersions) {
      const row = cells.filter(c => c.haxe === haxe);
      if (row.length === 0) continue;
      html += "<tr><td class='rowhead'>" + shortHaxe(haxe) + "</td>"
        + runtimes.map(r => "<td>" + pill(row.find(c => c.runtime === r)) + "</td>").join("") + "</tr>";
    }
  } else {
    const versions = DATA.meta.haxeVersions.filter(v => cells.some(c => c.haxe === v));
    const classNames = [...new Set(cells.flatMap(c => c.classes.map(k => k.name)))].sort();
    html += "<tr><th class='rowhead'>Suite</th>" + versions.map(v => "<th>" + shortHaxe(v) + "</th>").join("") + "</tr>";
    for (const name of classNames) {
      html += "<tr><td class='rowhead'>" + name + "</td>";
      for (const v of versions) {
        const cell = cells.find(c => c.haxe === v);
        const cls = cell && cell.classes.find(k => k.name === name);
        if (!cell || cell.status === "compile-fail" || cell.status === "timeout") { html += "<td>" + pill(cell) + "</td>"; continue; }
        if (!cls) { html += "<td><span class='pill na'>&mdash;</span></td>"; continue; }
        const fails = cls.failures + cls.errors;
        const flakyHere = (cell.flaky || []).some(t => t.startsWith(name + "::")) ? 1 : 0;
        html += "<td>" + (fails > 0
          ? "<span class='pill bad'>" + fails + " fail</span>"
          : okPill(cls.tests - cls.skipped, cls.tests, cls.skipped, flakyHere)) + "</td>";
      }
      html += "</tr>";
    }
  }
  html += "</table></div>";
  const fails = failuresOf(cells);
  if (fails.length > 0) {
    html += "<details open><summary>" + fails.length + " failing test" + (fails.length > 1 ? "s" : "") + "</summary>"
      + fails.map(f => "<div class='fail-item'><code>" + f.what + "</code> on " + f.where
                       + (f.message ? "<br>" + f.message.replace(/&/g, "&amp;").replace(/</g, "&lt;") : "") + "</div>").join("")
      + "</details>";
  }
  const flakies = cells.flatMap(cell => (cell.flaky || []).map(t =>
    ({ where: shortHaxe(cell.haxe) + (cell.runtime ? " × " + shortHl(cell.runtime) : ""), what: t })));
  if (flakies.length > 0) {
    html += "<details><summary style='color: var(--warn-text);'>" + flakies.length
      + " flaky test" + (flakies.length > 1 ? "s" : "") + " (failed once, passed on retry — machine load, not a version problem)</summary>"
      + flakies.map(f => "<div class='fail-item'><code>" + f.what + "</code> on " + f.where + "</div>").join("")
      + "</details>";
  }
  html += skipSection(cells);
  lanes.insertAdjacentHTML("beforeend", html);
}
</script>
</body>
</html>
