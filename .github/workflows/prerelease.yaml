name: Pre-release, IntelliJ-Haxe-plugin

on:
  push:
    tags:
      - "pre-release-[0-9]+.[0-9]+.[0-9]+**" # trigger on  tags that matches version numbers ex. pre-release-1.3.10

jobs:
  prepare:
    name: Create Pre-release draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.create_release.outputs.tag }}
    steps:
      - name: Create draft pre-release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="pre-release/$(date -u +%Y%m%d%H%M)"
          SHA8=$(echo "${GITHUB_SHA}" | cut -c1-8)
          gh release create "$TAG" \
            --target "${GITHUB_SHA}" \
            --draft \
            --prerelease \
            --title "Beta build ($SHA8)" \
            --notes "Automated beta build ($SHA8)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build and upload artifacts
    strategy:
      fail-fast: true # cancel all builds if one fails.
      matrix:
        IDEA_VERSION: [2026.2]
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Maximize Build Space (ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          architecture: x64
          cache: 'gradle'

      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: install haxelibs
        run: |
          haxelib install hxjava 4.2.0

      - name: Cache intelliJ downloads
        uses: actions/cache@v6
        with:
          path: $GITHUB_WORKSPACE/idea
          key: ${{ matrix.IDEA_VERSION }}-idea
          restore-keys: ${{ matrix.IDEA_VERSION }}-idea

      # debugger tests are skipped here (most need windows + the hxcpp
      # toolchain); the parallel 'debuggers' job below runs them for this
      # exact build, and 'finish' won't publish unless it passes
      - name: Build with Gradle
        run: ./gradlew clean test buildPlugin verifyPlugin

      - name: Upload asset to pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ARTIFACT_PATHNAME=$(ls *.zip | head -n 1)
          ASSET_NAME="intellij-haxe-${{ matrix.IDEA_VERSION }}-beta.zip"
          cp "$ARTIFACT_PATHNAME" "$ASSET_NAME"
          gh release upload "${{ needs.prepare.outputs.tag }}" "$ASSET_NAME" --clobber

  # tag pushes never trigger the path-filtered debugger-*.yaml workflows, so
  # test every debugger module here for the exact commit being released
  debuggers:
    name: Test debugger modules
    uses: ./.github/workflows/debugger-all.yaml

  finish:
    name: publish Pre-release
    needs: [prepare, build, debuggers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
