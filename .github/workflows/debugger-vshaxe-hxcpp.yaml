name: "Debugger: vshaxe-hxcpp-debugger-adapter"

on:
  push:
    branches: ['master', 'develop', 'dev/*', 'feature/*']
    paths:
      - 'debuggers/vshaxe-hxcpp-debugger-adapter/**'
      # shared dependency of every debugger module
      - 'debuggers/dap-protocol/**'
      # shared build inputs that can break any module build
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew*'
      # the CI definition itself
      - '.github/workflows/debugger-build.yaml'
      - '.github/workflows/debugger-vshaxe-hxcpp.yaml'
  pull_request:
    branches: ['master', 'develop', 'feature/*']
    paths:
      - 'debuggers/vshaxe-hxcpp-debugger-adapter/**'
      - 'debuggers/dap-protocol/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew*'
      - '.github/workflows/debugger-build.yaml'
      - '.github/workflows/debugger-vshaxe-hxcpp.yaml'

jobs:
  vshaxe-hxcpp-debugger-adapter:
    uses: ./.github/workflows/debugger-build.yaml
    with:
      module: vshaxe-hxcpp-debugger-adapter
      os: windows-latest
      needs-haxe: true
      haxelibs: |
        haxelib install hxcpp --quiet --always
        haxelib install hxcpp-debug-server 1.2.4 --quiet --always
