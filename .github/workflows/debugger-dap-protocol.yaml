name: "Debugger: dap-protocol"

on:
  push:
    branches: ['master', 'develop', 'dev/*', 'feature/*']
    paths:
      - 'debuggers/dap-protocol/**'
      # shared build inputs that can break any module build
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew*'
      # the CI definition itself
      - '.github/workflows/debugger-build.yaml'
      - '.github/workflows/debugger-dap-protocol.yaml'
  pull_request:
    branches: ['master', 'develop', 'feature/*']
    paths:
      - 'debuggers/dap-protocol/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'gradlew*'
      - '.github/workflows/debugger-build.yaml'
      - '.github/workflows/debugger-dap-protocol.yaml'

jobs:
  dap-protocol:
    uses: ./.github/workflows/debugger-build.yaml
    with:
      module: dap-protocol
      os: ubuntu-latest
      needs-haxe: false
