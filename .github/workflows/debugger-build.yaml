# Reusable build-and-test workflow for one debugger module. Not triggered
# directly: each debugger has a thin debugger-*.yaml caller whose paths:
# filter decides when its module needs a run.
name: Debugger build (reusable)

on:
  workflow_call:
    inputs:
      module:
        description: "Module name under :debuggers (also the gradle project to build)"
        required: true
        type: string
      os:
        description: "Runner image"
        required: false
        type: string
        default: windows-latest
      needs-haxe:
        description: "Install the Haxe toolchain"
        required: false
        type: boolean
        default: true
      needs-hashlink:
        description: "Download HashLink and export HASHLINK_BIN for the integration tests"
        required: false
        type: boolean
        default: false
      haxelibs:
        description: "haxelib install commands, one per line (pins should mirror the module's build.gradle.kts)"
        required: false
        type: string
        default: ''

jobs:
  build:
    name: "Debugger: ${{ inputs.module }}"
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'gradle'

      - name: Set up Haxe
        if: ${{ inputs.needs-haxe }}
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Install haxelib dependencies
        if: ${{ inputs.haxelibs != '' }}
        run: ${{ inputs.haxelibs }}

      - name: Install HashLink (for the HashLink integration tests)
        if: ${{ inputs.needs-hashlink }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # release tag is "1.15"; the windows asset is hashlink-1.15.0-win.zip
          gh release download 1.15 --repo HaxeFoundation/hashlink --pattern "*win*.zip" --dir hashlink-dist
          Get-ChildItem hashlink-dist -Filter *.zip | Expand-Archive -DestinationPath hashlink-dist
          $hl = Get-ChildItem hashlink-dist -Recurse -Filter hl.exe | Select-Object -First 1
          if (-not $hl) { throw "hl.exe not found in the HashLink release archive" }
          "HASHLINK_BIN=$($hl.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $hl.FullName --version

      # build = compile + unit tests + fixture builds + integration tests
      # against the real debuggee/VM
      - name: Build and test (windows)
        if: ${{ inputs.os == 'windows-latest' }}
        timeout-minutes: 40
        run: .\gradlew.bat :debuggers:${{ inputs.module }}:build

      - name: Build and test (linux/mac)
        if: ${{ inputs.os != 'windows-latest' }}
        timeout-minutes: 40
        run: ./gradlew :debuggers:${{ inputs.module }}:build
