name: Build, IntelliJ-Haxe-plugin

on:
  push:
    branches:
      - 'master'
      - 'develop'
      - 'dev/*'
      - 'feature/*'
  pull_request:
    branches:
      - 'master'
      - 'develop'
      - 'feature/*'

jobs:
  Build:
    strategy:
      fail-fast: false # set this to true if you want to cancel all builds if one fails.
      matrix:
        IDEA_VERSION: [2026.2]
        OS: [macos-15-intel, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.OS }}
    timeout-minutes: 30
    steps:
      - name: Maximize Build Space (ubuntu/mac)
        if: ${{ matrix.os != 'windows-latest'}}
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'gradle'


      - name: Set up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Test haxe
        run: haxe -version

      # Debugger tests are opt-in (-PdebuggerTests=true) and are NOT run here:
      # they need real toolchains (windows + hxcpp/HashLink) and run via the
      # compat-matrix tool / dedicated workflows. The HashLink adapter (shipped
      # in the plugin) still compiles here.
      - name: Build with Gradle (windows)
        timeout-minutes: 30
        if: ${{ matrix.os == 'windows-latest'}}
        run: .\gradlew.bat build

      - name: Build with Gradle (linux/mac)
        timeout-minutes: 30
        if: ${{ matrix.os != 'windows-latest'}}
        run: ./gradlew clean build

  verify:
    name: "Run verifyPlugin (ubuntu-latest)"
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 25
          cache: 'gradle'

      - name: verify plugin
        run: ./gradlew verifyPlugin
