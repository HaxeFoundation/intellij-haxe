[versions]
# libraries
# junit4 is not a test API here - the IJ test framework's JUnit3 fixture classes
# extend junit.framework.TestCase, which lives in the junit4 jar
junit = "4.13.2"
# jupiter 5.x pairs with platform 1.x (5.14.4 <-> 1.14.4)
junit5 = "5.14.4"
junitPlatform = "1.14.4"
lombok = "1.18.44"
jackson = "3.1.0"
commonmark = "0.21.0"
commonsText = "1.14.0"
commonsCompress = "1.26.2"

# plugins
changelog = "2.5.0"
intelliJPlatform = "2.18.1"
kotlin = "2.4.0"
kover = "0.9.8"
qodana = "2025.3.2"
grammarkit = "2023.3.0.3"
testLogger = "4.0.0"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
# aggregator: jupiter-api + jupiter-params + jupiter-engine
junitJupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
junitPlatformLauncher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }
jacksonDatabind = { group = "tools.jackson.core", name = "jackson-databind", version.ref = "jackson" }
commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
commonmarkAutolink = { group = "org.commonmark", name = "commonmark-ext-autolink", version.ref = "commonmark" }
commonmarkGfmTables = { group = "org.commonmark", name = "commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonsText = { group = "org.apache.commons", name = "commons-text", version.ref = "commonsText" }
commonsCompress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
intelliJPlatformGrammarKit = { id = "org.jetbrains.intellij.platform.grammarkit", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
grammarkit = { id = "org.jetbrains.grammarkit", version.ref = "grammarkit" }
testLogger = { id = "com.adarshr.test-logger", version.ref = "testLogger" }
