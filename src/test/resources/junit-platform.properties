# The IJ test framework's launcher session listener force-enables extension
# autodetection (System.setProperty at session start), so a gradle-level system
# property cannot turn its watchdog extensions off - this classpath file
# outranks system properties in the JUnit configuration-parameter lookup.
#
# The uncaught-exception watchdog is excluded: the suite mixes real-application
# tests with mock-application parsing tests in one JVM, and deferred background
# callbacks from the former (project-close hint cleanup, local history flush)
# intermittently fire while a mock application is installed, failing whichever
# test happens to be running. The remaining extensions (test logger, thread
# leak tracker, swing timer watcher) stay active.
junit.jupiter.extensions.autodetection.exclude=com.intellij.testFramework.junit5.impl.UncaughtExceptionExtension
