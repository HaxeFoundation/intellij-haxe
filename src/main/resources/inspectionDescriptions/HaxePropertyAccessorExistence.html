<body>
Reports properties declared with <code>get</code> or <code>set</code> access
whose accessor methods do not exist. The quick fix generates the missing
<code>get_</code>/<code>set_</code> method.
<p><b>Example:</b></p>
<pre><code>
class Counter {
    public var value(get, never):Int;   // get_value() is missing
}
</code></pre>
</body>
