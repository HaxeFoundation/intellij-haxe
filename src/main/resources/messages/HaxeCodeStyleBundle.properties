# hxformat.json integration: tab, per-file settings modifier, status bar, scheme import
hxformat.modifier.name=hxformat.json
hxformat.panel.tab.title=hxformat
hxformat.panel.use.project.config=Use the project's hxformat.json when present
hxformat.panel.description=<html>A file with an hxformat.json (haxe-formatter / vshaxe config) in its folder or above<br>is formatted by that config instead of this scheme's Haxe settings. As with the<br>command-line formatter, the nearest config wins. No scheme is created or changed;<br>turn this off to always use the scheme's own settings.</html>
hxformat.schema.name=hxformat.json (haxe-formatter)
hxformat.status.bar.text=hxformat
hxformat.status.bar.tooltip=Formatting rules from {0}
hxformat.status.bar.open.config=Open hxformat.json
hxformat.status.bar.disable=Disable hxformat.json overrides

hxformat.import.complete=All hxformat.json settings were imported.
hxformat.import.partial={0} setting(s) could not be imported: {1}
hxformat.import.parse.error=Cannot read hxformat.json: {0}

hxformat.unsupported.no.wrap.target={0} (no matching wrap setting)
hxformat.unsupported.multi.var=wrapping.multiVar (only the line-length split is reproduced)
hxformat.unsupported.rules={0}.rules (rule engine approximated by one policy)
hxformat.unsupported.array.rules={0}.rules (a rule shape without a threshold is not reproduced)
hxformat.unsupported.string.interpolation=whitespace.formatStringInterpolation=false (interpolations always format)
hxformat.unsupported.sharp.parens={0} (#if condition spacing is not configurable)
hxformat.unsupported.member.blanks={0} (all type kinds share one set of member blank lines)
