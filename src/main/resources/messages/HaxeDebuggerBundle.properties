# Debugger settings
haxe.debugger.render.tostring=Render Objects with toString()
haxe.debugger.render.tostring.description=Label objects with the result of their own toString() instead of the class name. Runs user code while rendering (side effects possible); on HXCPP a self-recursing toString crashes the debugged program.
haxe.debugger.render.tostring.warning=Rendering with toString() executes code from the debugged program every time the debugger displays a value. That code can have side effects (logging, state changes, lazy initialization), and a toString() that ends up calling itself (through circular references, for example) will CRASH the debugged program on HXCPP, where a stack overflow cannot be intercepted. If debugging behaves unexpectedly with this option on, turn it off.
haxe.debugger.settings.display.name=Haxe
haxe.debugger.expression.stepping=Expression Stepping (eval)
haxe.debugger.expression.stepping.description=Each step runs ONE interpreter sub-expression and the editor highlights the exact expression about to run. Eval sessions only; session-scoped (off on every new session).


